name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache: false

      - name: Vet
        working-directory: manager
        env:
          CGO_ENABLED: "0"
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "files above need gofmt"; exit 1; }
          go vet ./...

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sneakytorrents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the container without a VPN: the kill switch must come up, qBittorrent
      # must start, and qBittorrent's user must not be able to reach the internet.
      - name: Smoke test
        run: |
          docker run -d --name st --cap-add NET_ADMIN --device /dev/net/tun -p 8080:8080 sneakytorrents:ci
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8080/vpn/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/vpn/api/session
          docker logs st 2>&1 | grep -q 'kill switch active'
          for _ in $(seq 30); do
            docker logs st 2>&1 | grep -q 'WebUI will be started' && break
            sleep 1
          done
          if docker exec -u 1000 st wget -T 5 -q -O /dev/null http://1.1.1.1; then
            echo "qBittorrent's user reached the internet without a VPN"; exit 1
          fi
          docker exec st nft list counter inet sneaky leak_blocked

      - name: Logs
        if: always()
        run: docker logs st || true

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
